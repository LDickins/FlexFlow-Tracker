<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlexFlow — Fluctuating Income & Expense App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    input[type="number"]::-webkit-inner-spin-button { opacity: 1; }
    .glass { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(148, 163, 184, 0.15); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header & Month Selector -->
    <header class="glass rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          <span>⚡ FlexFlow</span>
          <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Variable Income Edition</span>
        </h1>
        <p class="text-slate-400 text-sm mt-1">Log each month's actual earnings, deduct expenses live, and track what you keep.</p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <input type="month" id="monthPicker" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-indigo-500" />
        <button onclick="copyFixedFromPrevMonth()" title="Copy fixed bills from previous month" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3.5 py-2.5 rounded-xl border border-slate-700 transition">
          ↻ Copy Fixed Bills
        </button>
        <button onclick="pullFromCloud()" id="syncBtn" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 text-xs font-medium px-3.5 py-2.5 rounded-xl transition">
          ☁️ Synced
        </button>
        <button onclick="exportCSV()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-3.5 py-2.5 rounded-xl transition">
          ↓ CSV
        </button>
      </div>
    </header>

    <!-- Live Hero Dashboard -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="glass rounded-2xl p-5 border-l-4 border-l-emerald-500">
        <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">This Month's Income</span>
        <div id="totalIncomeDisplay" class="text-3xl font-extrabold text-emerald-400 mt-1">€0.00</div>
        <p id="incomeCountText" class="text-xs text-slate-400 mt-1">0 income entries logged</p>
      </div>

      <div class="glass rounded-2xl p-5 border-l-4 border-l-rose-500">
        <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Total Deducted Expenses</span>
        <div id="totalExpenseDisplay" class="text-3xl font-extrabold text-rose-400 mt-1">€0.00</div>
        <p id="expenseSplitText" class="text-xs text-slate-400 mt-1">Fixed: €0 | Variable: €0</p>
      </div>

      <div class="glass rounded-2xl p-5 border-l-4 border-l-indigo-500">
        <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Net Remaining (Pocket)</span>
        <div id="netRemainingDisplay" class="text-3xl font-extrabold text-white mt-1">€0.00</div>
        <p id="marginText" class="text-xs text-indigo-30
